services:
  - type: web
    name: gozu-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: gozu-db
          property: connectionString
      - key: DATABASE_USER
        fromDatabase:
          name: gozu-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: gozu-db
          property: password
      - key: GOZU_ADMIN_USER
        sync: false
      - key: GOZU_ADMIN_PASSWORD
        sync: false
      - key: GOZU_CORS_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: "true"

  - type: web
    name: gozu-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/frontend/browser
    routes:
      - type: rewrite
        source: /api/*
        destination: https://gozu-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: gozu-db
    databaseName: gozu
    user: gozu
